<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https: wss:; media-src 'self' https:; worker-src 'self' blob:;" />
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <script>
      (function() {
        var CURRENT_VER = '2.2.0';
        if (localStorage.getItem('aerogym_app_ver') !== CURRENT_VER) {
          localStorage.setItem('aerogym_app_ver', CURRENT_VER);
          if ('caches' in window) {
            caches.keys().then(function(names) {
              for (var i = 0; i < names.length; i++) caches.delete(names[i]);
            });
          }
          if ('serviceWorker' in navigator) {
            navigator.serviceWorker.getRegistrations().then(function(regs) {
              for (var i = 0; i < regs.length; i++) regs[i].unregister();
            });
          }
        }
      })();
    </script>
    <title>AeroGym | Tu Entrenador Personal Inteligente</title>
    <meta name="theme-color" content="#0f172a" />
    <meta name="description" content="Domina tu entrenamiento con AeroGym. Registro de sesiones, análisis de progresión y entrenador inteligente." />
    <!-- Favicon & Touch Icon -->
    <link rel="icon" type="image/svg+xml" href="/Aerogym/favicon.svg" />
    <link rel="alternate icon" type="image/png" href="/Aerogym/icon-192.png" />
    <link rel="apple-touch-icon" href="/Aerogym/icon-192.png" />
  </head>
  <body class="bg-slate-950 text-slate-50">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
